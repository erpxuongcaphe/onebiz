name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  fnb-return-cost-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fnb_cost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fnb_cost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply migration and verify F&B return-cost behavior
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_cost_test
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00397_fnb_return_bom_cost_restore.integration.sql
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-original-cost-trigger.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00398_fnb_production_cancel_cost_restore.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00399_fnb_purchase_order_revert_cost.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00400_fnb_inventory_adjustment_transfer_cost.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00401_validate_fnb_branch_cost_event_source_type.integration.sql

      - name: Verify invoice-line BOM return snapshots in a disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_return_snapshot_test
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00410_fnb_invoice_item_bom_return_snapshot.setup.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00410_fnb_invoice_item_bom_return_snapshot.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00410_fnb_invoice_item_bom_return_snapshot.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00410_fnb_invoice_item_bom_return_snapshot.integration.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00415_fnb_linked_supply_return.setup.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-linked-cost-flow.sql --replace
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f /tmp/fnb-linked-cost-flow.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00415_fnb_linked_supply_return.integration.sql

      - name: Verify internal-sale price to F&B BOM cost in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_supply_flow_test
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00414_fnb_supply_to_bom_cost.setup.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-supply-cost-flow.sql
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f /tmp/fnb-supply-cost-flow.sql
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00414_fnb_supply_to_bom_cost.integration.sql

      - name: Verify historical XNT valuation in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb xnt_valuation_test
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00404_historical_xnt_valuation.integration.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00411_strict_fnb_bom_xnt_cost.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00411_strict_fnb_bom_xnt_cost.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00411_strict_fnb_bom_xnt_cost.integration.sql

      - name: Verify sales-return source identity in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb return_identity_test
          PGDATABASE=return_identity_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00405_return_item_source_identity.integration.sql

      - name: Verify snapshot-only profit and loss in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb profit_loss_test
          PGDATABASE=profit_loss_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00406_profit_loss_snapshot_cogs.integration.sql

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
        # CEO 10/07: next build cần biến Supabase để khởi tạo @supabase/ssr
        # (chỉ KHỞI TẠO client, KHÔNG kết nối DB lúc build) → placeholder cho CI.
        # Vercel dùng biến THẬT khi deploy production.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci-build

