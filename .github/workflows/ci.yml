  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Verify USB worker lifecycle without a physical printer
        run: node --test scripts/test-usb-worker.mjs scripts/test-print-recovery.mjs

      - name: Verify print supervisor recovery with fake processes
        shell: pwsh
        run: ./scripts/test-print-supervisor.ps1

      - name: Build
        run: npm run build
        # CEO 10/07: next build cần biến Supabase để khởi tạo @supabase/ssr
        # (chỉ KHỞI TẠO client, KHÔNG kết nối DB lúc build) → placeholder cho CI.
        # Vercel dùng biến THẬT khi deploy production.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci-build
