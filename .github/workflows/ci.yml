name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  fnb-return-cost-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fnb_cost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fnb_cost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify internal POS paired payments and reversal in disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          npm install --prefix "$RUNNER_TEMP/internal-pos-runtime" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          node scripts/fnb-db-test/run-internal-pos-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-actual-receiving-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          FNB_PGLITE_DIR="$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js" node scripts/fnb-db-test/run-trading-status.cjs
          FNB_PGLITE_DIR="$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js" node scripts/fnb-db-test/run-negative-stock.cjs
          FNB_PGLITE_DIR="$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js" node scripts/fnb-db-test/run-stocktake-depleted.mjs
          FNB_RECORD_SQL="$RUNNER_TEMP/inventory-count-fixture.sql" FNB_PGLITE_DIR="$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js" node scripts/fnb-db-test/run-inventory-check-amendment.mjs
          createdb inventory_count_correction_test
          PGDATABASE=inventory_count_correction_test psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/inventory-count-fixture.sql"
          PGDATABASE=inventory_count_correction_test python3 scripts/fnb-db-test/inventory-check-concurrency.py
          mkdir -p .tmp
          node scripts/fnb-db-test/run-modifier-scale-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-branch-bom-clone-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-opening-defaults-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-supplier-purchase-notes-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-branch-price-save-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-branch-price-save-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js" --initialized
          node scripts/fnb-db-test/run-branch-trading-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-delivery-staff-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-branch-restore-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-explicit-sweetness-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-safe-recipe-defaults-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-shift-totals-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-invoice-type-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-recipe-stock-correction-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-production-value-restatement-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-operational-uom-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-gram-cutover-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-production-input-compat-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-production-used-adjustment-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-production-corrections-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-expiry-time-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-delivery-policy-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-selected-discount-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-paid-context-zero-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-split-quantities-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-multiple-bills-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-delivery-dispatch-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-dashboard-sales-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-void-active-receipts-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"

      - name: Verify FNB stock hardening and concurrent checkout
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_hardening_test
        run: |
          createdb fnb_hardening_test
          node scripts/fnb-db-test/extract-stock-hardening-fixture.mjs /tmp/fnb-hardening-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/fnb-hardening-fixture.sql
          python3 scripts/fnb-db-test/stock-hardening-concurrency.py
          node scripts/fnb-db-test/run-stock-hardening-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-document-locks-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-manager-approvals-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"
          node scripts/fnb-db-test/run-branch-layout-local.mjs "$RUNNER_TEMP/internal-pos-runtime/node_modules/@electric-sql/pglite/dist/index.js"

      - name: Verify branch request changes and warehouse race safety
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          node scripts/test-fnb-warehouse-bridge.mjs "$RUNNER_TEMP/internal-pos-runtime/package.json"
          createdb onebiz_warehouse_change_test
          node scripts/fnb-db-test/extract-warehouse-change-fixture.mjs /tmp/warehouse-change-fixture.sql
          PGDATABASE=onebiz_warehouse_change_test psql -X -v ON_ERROR_STOP=1 -f /tmp/warehouse-change-fixture.sql
          PGDATABASE=onebiz_warehouse_change_test python3 scripts/fnb-db-test/warehouse-change-concurrency.py

      - name: Verify atomic opening stock and isolated branch value
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb opening_stock_test
          node scripts/fnb-db-test/extract-opening-stock.mjs /tmp/opening-stock-helpers.sql
          PGDATABASE=opening_stock_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00442_safe_opening_stock.integration.sql
          node scripts/fnb-db-test/extract-inventory-cost-trigger.mjs /tmp/fnb-inventory-cost-trigger.sql
          PGDATABASE=opening_stock_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00444_zero_stock_opening_cost_quotes.integration.sql

      - name: Verify branch print permissions, idempotency and device claims
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_print_queue_test
          PGDATABASE=fnb_print_queue_test psql -v ON_ERROR_STOP=1 -f supabase/tests/fnb_print_recoverable_claim.integration.sql
          PGDATABASE=fnb_print_queue_test node scripts/test-print-burst-concurrency.mjs

      - name: Verify invoice code allocation in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb invoice_code_test
          PGDATABASE=invoice_code_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00433_invoice_code_collision_guard.integration.sql
          export PGDATABASE=invoice_code_test
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.code_sequences SET prefix='HD',current_number=1000 WHERE entity_type='invoice';"
          psql -v ON_ERROR_STOP=1 -c "BEGIN; SELECT public.next_code('10000000-0000-0000-0000-000000000001','invoice'); SELECT pg_sleep(2); COMMIT;" > /tmp/invoice-first.txt &
          first_pid=$!
          psql -v ON_ERROR_STOP=1 -c "SELECT public.next_code('10000000-0000-0000-0000-000000000001','invoice');" > /tmp/invoice-second.txt
          wait "$first_pid"
          grep -q 'HD001001' /tmp/invoice-first.txt /tmp/invoice-second.txt
          grep -q 'HD001002' /tmp/invoice-first.txt /tmp/invoice-second.txt

      - name: Verify cash occurrence dates and authorization in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb cash_time_test
          PGDATABASE=cash_time_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00432_cash_transaction_time.integration.sql

      - name: Verify unpaid FNB cancellation preserves sibling bills
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_unpaid_cancel_test
          node scripts/fnb-db-test/extract-unpaid-cancel.mjs /tmp/fnb-unpaid-cancel-original.sql
          export PGDATABASE=fnb_unpaid_cancel_test
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00452_fnb_cancel.setup.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/fnb-unpaid-cancel-original.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/00452_fnb_cancel_preserve_sibling_bills.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00452_fnb_cancel.integration.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/00452_fnb_cancel_preserve_sibling_bills.sql
          psql -X -v ON_ERROR_STOP=1 -c 'SELECT test_fixture();'
          psql -X -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('test.actor',test_id(1)::text,true); SELECT fnb_cancel_unpaid_order_atomic(test_id(10),'Khách đổi ý'); SELECT pg_sleep(2); COMMIT;" > /tmp/cancel-main.txt &
          cancel_pid=$!
          psql -X -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('test.actor',test_id(1)::text,true); SELECT fnb_cancel_unpaid_order_atomic(test_id(11),'Khách đổi ý'); COMMIT;" > /tmp/cancel-child.txt
          wait "$cancel_pid"
          psql -X -v ON_ERROR_STOP=1 -c "SELECT test_assert((SELECT status='available' AND current_order_id IS NULL FROM restaurant_tables WHERE id=test_id(9)), 'Concurrent final table'); SELECT test_assert((SELECT count(*)=2 FROM pos_exception_events), 'Concurrent single event per bill');"

      - name: Verify unified operation history authorization and filters
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb operation_history_test
          export PGDATABASE=operation_history_test
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00452_fnb_cancel.setup.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00453_operation_history.integration.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/00453_unified_operation_history.sql

      - name: Apply migration and verify F&B return-cost behavior
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_cost_test
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00397_fnb_return_bom_cost_restore.integration.sql
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-original-cost-trigger.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00398_fnb_production_cancel_cost_restore.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00399_fnb_purchase_order_revert_cost.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00400_fnb_inventory_adjustment_transfer_cost.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00401_validate_fnb_branch_cost_event_source_type.integration.sql

      - name: Verify invoice-line BOM return snapshots in a disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_return_snapshot_test
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00410_fnb_invoice_item_bom_return_snapshot.setup.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00410_fnb_invoice_item_bom_return_snapshot.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00410_fnb_invoice_item_bom_return_snapshot.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00410_fnb_invoice_item_bom_return_snapshot.integration.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00415_fnb_linked_supply_return.setup.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-linked-cost-flow.sql --replace
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f /tmp/fnb-linked-cost-flow.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00415_fnb_linked_supply_return.integration.sql

      - name: Verify internal-sale price to F&B BOM cost in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_supply_flow_test
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00414_fnb_supply_to_bom_cost.setup.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-supply-cost-flow.sql
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f /tmp/fnb-supply-cost-flow.sql
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00414_fnb_supply_to_bom_cost.integration.sql

      - name: Verify prepared batch completion cost reaches drink BOM
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-prepared-cost-trigger.sql
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00416_fnb_prepared_batch_to_bom_cost.integration.sql

      - name: Verify real prepared-batch production function chain
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_real_production_test
          node scripts/fnb-db-test/extract-production-chain.mjs /tmp/fnb-real-production-chain.sql
          PGDATABASE=fnb_real_production_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00417_fnb_real_production_chain.integration.sql

      - name: Verify Retail internal-sale stock-out routing
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_internal_sale_stock_out_test
          node scripts/fnb-db-test/extract-internal-sale-stock-out.mjs /tmp/fnb-internal-sale-stock-out.sql
          PGDATABASE=fnb_internal_sale_stock_out_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00418_fnb_internal_sale_stock_out.integration.sql

      - name: Setup Node for connected production dialog tests
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify production dialog to actual PostgreSQL RPC
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_ui_production_test
          FNB_UI_DB_TEST: '1'
        run: |
          npm install --global npm@11.6.2
          npm ci
          createdb fnb_ui_production_test
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00417_fnb_real_production_chain.integration.sql
          node scripts/fnb-db-test/extract-operational-uom.mjs /tmp/operational-uom-ui-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/operational-uom-ui-fixture.sql
          npx vitest run --config scripts/fnb-db-test/vitest.production.config.ts

      - name: Verify complete internal-sale documents and XTB cost
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_internal_sale_complete_test
          node scripts/fnb-db-test/extract-internal-sale-documents.mjs /tmp/fnb-internal-sale-documents.sql
          node scripts/fnb-db-test/extract-internal-sale-stock-out.mjs /tmp/fnb-internal-sale-stock-out.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-supply-cost-flow.sql
          PGDATABASE=fnb_internal_sale_complete_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00419_fnb_internal_sale_complete_chain.integration.sql

      - name: Verify finite F&B table transfer business conflicts
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_transfer_conflict_test
          PGDATABASE=fnb_transfer_conflict_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00420_fnb_transfer_business_conflict.integration.sql

      - name: Verify persisted F&B payment replay and access guards
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_payment_replay_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          PGDATABASE=fnb_payment_replay_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00421_fnb_payment_replay.integration.sql

      - name: Verify simultaneous F&B payment and BOM posting
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_payment_concurrency_test
        run: |
          createdb fnb_payment_concurrency_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          node scripts/fnb-db-test/extract-payment-posting-chain.mjs /tmp/fnb-payment-posting-chain.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00422_fnb_payment_concurrency.setup.sql
          node scripts/fnb-db-test/run-payment-concurrency.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00422_fnb_payment_concurrency.integration.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00433_fnb_cash_time_candidate.integration.sql

      - name: Verify checkout branch WAC ledger and invoice line costs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_payment_cost_test
        run: |
          createdb fnb_payment_cost_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          node scripts/fnb-db-test/extract-payment-posting-chain.mjs /tmp/fnb-payment-posting-chain.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-checkout-cost-ledger.sql --replace --ledger-only
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-original-cost-trigger.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00423_fnb_checkout_cost_ledger.integration.sql
          node scripts/fnb-db-test/run-payment-concurrency.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00423_fnb_checkout_cost_ledger.assertions.sql

      - name: Verify paid BOM snapshots to historical partial return cost
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_payment_return_cost_test
        run: |
          createdb fnb_payment_return_cost_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          node scripts/fnb-db-test/extract-payment-posting-chain.mjs /tmp/fnb-payment-posting-chain.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-checkout-cost-ledger.sql --replace --ledger-only
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-original-cost-trigger.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00424_fnb_payment_return_cost.integration.sql

      - name: Verify full F&B refund with cash and lot reconciliation
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_full_refund_test
        run: |
          createdb fnb_full_refund_test
