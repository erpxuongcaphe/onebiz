name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  fnb-return-cost-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fnb_cost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fnb_cost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify atomic opening stock and isolated branch value
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb opening_stock_test
          node scripts/fnb-db-test/extract-opening-stock.mjs /tmp/opening-stock-helpers.sql
          PGDATABASE=opening_stock_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00442_safe_opening_stock.integration.sql
          node scripts/fnb-db-test/extract-inventory-cost-trigger.mjs /tmp/fnb-inventory-cost-trigger.sql
          PGDATABASE=opening_stock_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00444_zero_stock_opening_cost_quotes.integration.sql

      - name: Verify branch print permissions, idempotency and device claims
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_print_queue_test
          PGDATABASE=fnb_print_queue_test psql -v ON_ERROR_STOP=1 -f supabase/tests/branch_print_queue.integration.sql

      - name: Verify invoice code allocation in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb invoice_code_test
          PGDATABASE=invoice_code_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00433_invoice_code_collision_guard.integration.sql
          export PGDATABASE=invoice_code_test
          psql -v ON_ERROR_STOP=1 -c "UPDATE public.code_sequences SET prefix='HD',current_number=1000 WHERE entity_type='invoice';"
          psql -v ON_ERROR_STOP=1 -c "BEGIN; SELECT public.next_code('10000000-0000-0000-0000-000000000001','invoice'); SELECT pg_sleep(2); COMMIT;" > /tmp/invoice-first.txt &
          first_pid=$!
          psql -v ON_ERROR_STOP=1 -c "SELECT public.next_code('10000000-0000-0000-0000-000000000001','invoice');" > /tmp/invoice-second.txt
          wait "$first_pid"
          grep -q 'HD001001' /tmp/invoice-first.txt /tmp/invoice-second.txt
          grep -q 'HD001002' /tmp/invoice-first.txt /tmp/invoice-second.txt

      - name: Verify cash occurrence dates and authorization in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb cash_time_test
          PGDATABASE=cash_time_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00432_cash_transaction_time.integration.sql

      - name: Verify unpaid FNB cancellation preserves sibling bills
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_unpaid_cancel_test
          node scripts/fnb-db-test/extract-unpaid-cancel.mjs /tmp/fnb-unpaid-cancel-original.sql
          export PGDATABASE=fnb_unpaid_cancel_test
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00452_fnb_cancel.setup.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/fnb-unpaid-cancel-original.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/00452_fnb_cancel_preserve_sibling_bills.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00452_fnb_cancel.integration.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/00452_fnb_cancel_preserve_sibling_bills.sql
          psql -X -v ON_ERROR_STOP=1 -c 'SELECT test_fixture();'
          psql -X -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('test.actor',test_id(1)::text,true); SELECT fnb_cancel_unpaid_order_atomic(test_id(10),'Khách đổi ý'); SELECT pg_sleep(2); COMMIT;" > /tmp/cancel-main.txt &
          cancel_pid=$!
          psql -X -v ON_ERROR_STOP=1 -c "BEGIN; SELECT set_config('test.actor',test_id(1)::text,true); SELECT fnb_cancel_unpaid_order_atomic(test_id(11),'Khách đổi ý'); COMMIT;" > /tmp/cancel-child.txt
          wait "$cancel_pid"
          psql -X -v ON_ERROR_STOP=1 -c "SELECT test_assert((SELECT status='available' AND current_order_id IS NULL FROM restaurant_tables WHERE id=test_id(9)), 'Concurrent final table'); SELECT test_assert((SELECT count(*)=2 FROM pos_exception_events), 'Concurrent single event per bill');"

      - name: Verify unified operation history authorization and filters
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb operation_history_test
          export PGDATABASE=operation_history_test
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00452_fnb_cancel.setup.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00453_operation_history.integration.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/00453_unified_operation_history.sql

      - name: Apply migration and verify F&B return-cost behavior
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_cost_test
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00397_fnb_return_bom_cost_restore.integration.sql
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-original-cost-trigger.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00398_fnb_production_cancel_cost_restore.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00399_fnb_purchase_order_revert_cost.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00400_fnb_inventory_adjustment_transfer_cost.integration.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/00401_validate_fnb_branch_cost_event_source_type.integration.sql

      - name: Verify invoice-line BOM return snapshots in a disposable database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_return_snapshot_test
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00410_fnb_invoice_item_bom_return_snapshot.setup.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00410_fnb_invoice_item_bom_return_snapshot.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00410_fnb_invoice_item_bom_return_snapshot.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00410_fnb_invoice_item_bom_return_snapshot.integration.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00415_fnb_linked_supply_return.setup.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-linked-cost-flow.sql --replace
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f /tmp/fnb-linked-cost-flow.sql
          PGDATABASE=fnb_return_snapshot_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00415_fnb_linked_supply_return.integration.sql

      - name: Verify internal-sale price to F&B BOM cost in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_supply_flow_test
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00414_fnb_supply_to_bom_cost.setup.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-supply-cost-flow.sql
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f /tmp/fnb-supply-cost-flow.sql
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00414_fnb_supply_to_bom_cost.integration.sql

      - name: Verify prepared batch completion cost reaches drink BOM
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-prepared-cost-trigger.sql
          PGDATABASE=fnb_supply_flow_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00416_fnb_prepared_batch_to_bom_cost.integration.sql

      - name: Verify real prepared-batch production function chain
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_real_production_test
          node scripts/fnb-db-test/extract-production-chain.mjs /tmp/fnb-real-production-chain.sql
          PGDATABASE=fnb_real_production_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00417_fnb_real_production_chain.integration.sql

      - name: Verify Retail internal-sale stock-out routing
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_internal_sale_stock_out_test
          node scripts/fnb-db-test/extract-internal-sale-stock-out.mjs /tmp/fnb-internal-sale-stock-out.sql
          PGDATABASE=fnb_internal_sale_stock_out_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00418_fnb_internal_sale_stock_out.integration.sql

      - name: Setup Node for connected production dialog tests
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify production dialog to actual PostgreSQL RPC
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_ui_production_test
          FNB_UI_DB_TEST: '1'
        run: |
          npm install --global npm@11.6.2
          npm ci
          createdb fnb_ui_production_test
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00417_fnb_real_production_chain.integration.sql
          npx vitest run --config scripts/fnb-db-test/vitest.production.config.ts

      - name: Verify complete internal-sale documents and XTB cost
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_internal_sale_complete_test
          node scripts/fnb-db-test/extract-internal-sale-documents.mjs /tmp/fnb-internal-sale-documents.sql
          node scripts/fnb-db-test/extract-internal-sale-stock-out.mjs /tmp/fnb-internal-sale-stock-out.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-supply-cost-flow.sql
          PGDATABASE=fnb_internal_sale_complete_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00419_fnb_internal_sale_complete_chain.integration.sql

      - name: Verify finite F&B table transfer business conflicts
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_transfer_conflict_test
          PGDATABASE=fnb_transfer_conflict_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00420_fnb_transfer_business_conflict.integration.sql

      - name: Verify persisted F&B payment replay and access guards
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_payment_replay_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          PGDATABASE=fnb_payment_replay_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00421_fnb_payment_replay.integration.sql

      - name: Verify simultaneous F&B payment and BOM posting
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_payment_concurrency_test
        run: |
          createdb fnb_payment_concurrency_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          node scripts/fnb-db-test/extract-payment-posting-chain.mjs /tmp/fnb-payment-posting-chain.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00422_fnb_payment_concurrency.setup.sql
          node scripts/fnb-db-test/run-payment-concurrency.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00422_fnb_payment_concurrency.integration.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00433_fnb_cash_time_candidate.integration.sql

      - name: Verify checkout branch WAC ledger and invoice line costs
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_payment_cost_test
        run: |
          createdb fnb_payment_cost_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          node scripts/fnb-db-test/extract-payment-posting-chain.mjs /tmp/fnb-payment-posting-chain.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-checkout-cost-ledger.sql --replace --ledger-only
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-original-cost-trigger.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00423_fnb_checkout_cost_ledger.integration.sql
          node scripts/fnb-db-test/run-payment-concurrency.mjs
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00423_fnb_checkout_cost_ledger.assertions.sql

      - name: Verify paid BOM snapshots to historical partial return cost
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_payment_return_cost_test
        run: |
          createdb fnb_payment_return_cost_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          node scripts/fnb-db-test/extract-payment-posting-chain.mjs /tmp/fnb-payment-posting-chain.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-checkout-cost-ledger.sql --replace --ledger-only
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-original-cost-trigger.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00424_fnb_payment_return_cost.integration.sql

      - name: Verify full F&B refund with cash and lot reconciliation
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: fnb_full_refund_test
        run: |
          createdb fnb_full_refund_test
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          node scripts/fnb-db-test/extract-payment-posting-chain.mjs /tmp/fnb-payment-posting-chain.sql
          node scripts/fnb-db-test/extract-supply-cost-flow.mjs /tmp/fnb-checkout-cost-ledger.sql --replace --ledger-only
          node scripts/fnb-db-test/extract-cost-trigger.mjs /tmp/fnb-original-cost-trigger.sql
          node scripts/fnb-db-test/extract-sales-return-chain.mjs /tmp/fnb-sales-return-chain.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00425_fnb_full_refund.integration.sql

      - name: Verify historical XNT valuation in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb xnt_valuation_test
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00404_historical_xnt_valuation.integration.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00411_strict_fnb_bom_xnt_cost.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00411_strict_fnb_bom_xnt_cost.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00411_strict_fnb_bom_xnt_cost.integration.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00441_xnt_independent_period_values.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/migrations/00441_xnt_independent_period_values.sql
          PGDATABASE=xnt_valuation_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00441_xnt_independent_period_values.integration.sql

      - name: Verify sales-return source identity in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb return_identity_test
          PGDATABASE=return_identity_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00405_return_item_source_identity.integration.sql

      - name: Verify snapshot-only profit and loss in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb profit_loss_test
          PGDATABASE=profit_loss_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00406_profit_loss_snapshot_cogs.integration.sql
          createdb profit_loss_cross_period_test
          PGDATABASE=profit_loss_cross_period_test psql -v ON_ERROR_STOP=1 -f supabase/tests/00426_profit_loss_cross_period.integration.sql

      - name: Verify read-only kitchen return summary in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb kitchen_return_summary_test
          PGDATABASE=kitchen_return_summary_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00427_kitchen_return_summary.integration.sql

      - name: Verify exact F&B kitchen line source in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb kitchen_line_source_test
          PGDATABASE=kitchen_line_source_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00428_fnb_kitchen_line_source.integration.sql
            createdb kds_exact_return_test
            PGDATABASE=kds_exact_return_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00429_kds_exact_return_quantities.integration.sql

      - name: Verify shared menu ordering in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_menu_order_test
          PGDATABASE=fnb_menu_order_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00430_fnb_menu_order.integration.sql

      - name: Verify modifier ordering, inheritance, tenant boundaries and preserved defaults
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_modifier_order_test
          PGDATABASE=fnb_modifier_order_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00431_fnb_modifier_order.integration.sql

      - name: Verify cash performer context in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb cash_performer_test
          PGDATABASE=cash_performer_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00435_cash_performer_context.integration.sql

      - name: Verify atomic customer group codes in an isolated database
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb customer_group_codes_test
          export PGDATABASE=customer_group_codes_test
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00437_customer_group_code_allocation.integration.sql
          psql -X -v ON_ERROR_STOP=1 -c "select public.test_concurrent_customer('Concurrent A');" &
          first=$!
          psql -X -v ON_ERROR_STOP=1 -c "select public.test_concurrent_customer('Concurrent B');" &
          second=$!
          wait "$first"
          wait "$second"
          psql -X -v ON_ERROR_STOP=1 -c "do \$\$ begin if (select count(distinct code) from public.customers where name like 'Concurrent %')<>2 then raise exception 'concurrent codes collided'; end if; end; \$\$;"

      - name: Verify management recognition and cash linkage in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb management_finance_test
          PGDATABASE=management_finance_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00438_management_income_expense_ledger.integration.sql
          PGDATABASE=management_finance_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00440_management_finance_cash_flow_sources.integration.sql
          createdb management_finance_pnl_test
          PGDATABASE=management_finance_pnl_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00439_management_finance_pnl_recognition.integration.sql

      - name: Verify shared FnB customer selection in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_customer_context_test
          PGDATABASE=fnb_customer_context_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00447_fnb_order_customer_context.integration.sql

      - name: Verify sequential FNB split bill codes in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb fnb_sequential_codes_test
          PGDATABASE=fnb_sequential_codes_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00451_fnb_sequential_codes.integration.sql

      - name: Verify remaining FNB quantities across checkout and split in PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          node scripts/fnb-db-test/extract-payment-posting-chain.mjs /tmp/fnb-payment-posting-chain.sql
          node scripts/fnb-db-test/extract-payment-replay-chain.mjs /tmp/fnb-payment-replay-chain.sql
          node scripts/fnb-db-test/extract-effective-quantity-chain.mjs /tmp/fnb-effective-quantity-chain.sql
          createdb fnb_effective_qty_test
          PGDATABASE=fnb_effective_qty_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00458_promotion_beneficiaries.integration.sql

      - name: Verify exact FNB item cancellation approvals
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          node scripts/fnb-db-test/extract-unpaid-cancel.mjs /tmp/fnb-unpaid-cancel-chain.sql
          createdb fnb_cancel_request_test
          PGDATABASE=fnb_cancel_request_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00455_fnb_cancel_requests.integration.sql
          node scripts/fnb-db-test/extract-void-core.mjs /tmp/fnb-void-core.sql
          createdb fnb_void_method_test
          PGDATABASE=fnb_void_method_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00456_fnb_void_methods.integration.sql

      - name: Verify historical SKU and material reports in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb report_completeness_test
          PGDATABASE=report_completeness_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00461_report_stock_and_sku_snapshots.integration.sql

      - name: Verify PIN onboarding and recovery in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          createdb pos_pin_onboarding_test
          PGDATABASE=pos_pin_onboarding_test psql -X -v ON_ERROR_STOP=1 -f supabase/tests/00459_pos_pin_onboarding.integration.sql

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
        # CEO 10/07: next build cần biến Supabase để khởi tạo @supabase/ssr
        # (chỉ KHỞI TẠO client, KHÔNG kết nối DB lúc build) → placeholder cho CI.
        # Vercel dùng biến THẬT khi deploy production.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-ci-build

