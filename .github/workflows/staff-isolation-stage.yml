name: Staff isolation stage
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261113095915_staff_stock_invariant_tenant_scope.sql'
      - 'supabase/migrations/20261113101200_staff_customer_purchase_trigger_scope.sql'
      - 'scripts/test-staff-isolation-stage.mjs'
      - '.github/workflows/staff-isolation-stage.yml'
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: onebiz_isolation_test
          POSTGRES_USER: staff_test
          POSTGRES_PASSWORD: ephemeral-test-only
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U staff_test -d onebiz_isolation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify scope and checkout trigger
        env:
          STAFF_ISOLATION_TEST_DB: onebiz_isolation_test
        run: node scripts/test-staff-isolation-stage.mjs
