name: Hub quality database acceptance

on:
  pull_request:
    paths:
      - 'src/**/operations/**'
      - 'supabase/migrations/*operations*'
      - 'scripts/hub-qc-test/**'
      - 'Hub/PREFLIGHT_QC_READ_ONLY.sql'
      - '.github/workflows/hub-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/**/operations/**'
      - 'supabase/migrations/*operations*'
      - 'scripts/hub-qc-test/**'
      - 'Hub/PREFLIGHT_QC_READ_ONLY.sql'
      - '.github/workflows/hub-quality.yml'

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL runtime
        run: npm install --prefix "$RUNNER_TEMP/hub-quality-runtime" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify Hub workflows and database permissions
        run: HUB_PGLITE_DIR="$RUNNER_TEMP/hub-quality-runtime/node_modules/@electric-sql/pglite" node scripts/hub-qc-test/run.cjs
      - name: Verify shared criteria library and branch rollout without production data
        run: HUB_PGLITE_DIR="$RUNNER_TEMP/hub-quality-runtime/node_modules/@electric-sql/pglite" node scripts/hub-qc-test/working-library-acceptance.cjs
      - name: Verify shared managers and atomic branch permissions
        run: HUB_PGLITE_DIR="$RUNNER_TEMP/hub-quality-runtime/node_modules/@electric-sql/pglite" node scripts/hub-qc-test/shared-managers-acceptance.cjs
